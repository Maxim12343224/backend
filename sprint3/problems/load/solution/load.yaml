phantom:
  address: localhost:8080
  ammofile: /sprint3/problems/ammo/solution/ammo.txt
  load_profile:
    load_type: rps
    schedule: line(1, 50, 30s)
  ssl: false

autostop:
  enabled: true
  autostop:
    - http(50%, 35ms)
    - http(90%, 50ms)

telegraf:
  package: yandextank.plugins.Telegraf
  config: monitoring.xml