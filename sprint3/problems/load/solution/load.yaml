overload:
  enabled: false

phantom:
  address: 127.0.0.1:8080
  ammofile: ./ammo.txt
  ammo_type: uri
  load_profile:
    load_type: rps
    schedule: line(1, 20, 30s)
  ssl: false
  connection_test: false

autostop:
  autostop:
    - http(50%, 35, 5s)
    - http(90%, 50, 5s)

console:
  enabled: false

telegraf:
  enabled: false